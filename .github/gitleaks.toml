title = "Gitleaks config for Firebase Client ID"
description = "Detect Firebase client IDs in Swift or config files"

[[rules]]
id = "firebase-client-id"
description = "Firebase Client ID (UUID style)"
regex = '''firebaseClientID\s*=\s*["']?[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}["']?'''
tags = ["firebase", "custom"]
