name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '21 23 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: swift
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Select Xcode 16
    - name: Select Xcode 16
      if: matrix.language == 'swift'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build Swift project (manual)
      if: matrix.language == 'swift'
      run: |
        xcodebuild build \
        -project GithubSecurity/GithubSecurity.xcodeproj \
        -scheme GithubSecurity \
        -destination 'platform=iOS Simulator,name=iPhone 16 Plus' \
        CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    # Upload CodeQL bundled database
    - name: Upload CodeQL database bundle
      if: matrix.language == 'swift'
      uses: actions/upload-artifact@v4
      with:
        name: swift-codeql-database
        path: /Users/runner/work/_temp/codeql_databases/swift.zip
