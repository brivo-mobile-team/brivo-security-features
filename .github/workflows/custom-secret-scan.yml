name: Custom Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Gitleaks with custom Firebase pattern
      uses: gitleaks/gitleaks-action@v2
      with:
        config: .github/gitleaks.toml
