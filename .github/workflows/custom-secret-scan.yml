name: Custom Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Gitleaks with custom Firebase rule
      run: |
        # 1. Fetch the latest Gitleaks release version tag using GitHub API
        #    jq is used to parse the JSON response and extract the 'tag_name'
        LATEST_VERSION=$(curl -sL https://api.github.com/repos/zricethezav/gitleaks/releases/latest | jq -r ".tag_name")
        
        # Handle cases where LATEST_VERSION might be empty or invalid
        if [ -z "$LATEST_VERSION" ]; then
          echo "Error: Could not determine the latest Gitleaks version."
          exit 1
        fi

        # 2. Construct the precise download URL for the Linux AMD64 asset
        #    Gitleaks uses 'vX.Y.Z' for tags but 'X.Y.Z' in filename, so we remove 'v' prefix
        #    The asset naming convention is gitleaks_{version}_linux_x64.tar.gz
        DOWNLOAD_URL="https://github.com/zricethezav/gitleaks/releases/download/${LATEST_VERSION}/gitleaks_${LATEST_VERSION//v/}_linux_x64.tar.gz"
        
        echo "Attempting to download Gitleaks from: $DOWNLOAD_URL"
        
        # 3. Download and extract Gitleaks
        #    -f : fail silently on HTTP errors (e.g., 404)
        curl -sL -f "$DOWNLOAD_URL" | tar xz
        
        # Check if tar extraction was successful
        if [ $? -ne 0 ]; then
          echo "Error: Gitleaks download or extraction failed. The URL or file format might be incorrect."
          echo "Tried to download from: $DOWNLOAD_URL"
          exit 1
        fi

        # 4. Make it executable and run the scan
        chmod +x gitleaks
        ./gitleaks detect --config .github/gitleaks.toml --exit-code=2
