name: Custom Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Gitleaks with custom Firebase rule
      run: |
        curl -sL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64.tar.gz | tar xz
        chmod +x gitleaks
        ./gitleaks detect --config .github/gitleaks.toml --exit-code=2
